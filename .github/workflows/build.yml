# Test builds (docs/development/specs/00-infrastructure.md, 3.5): builds the plugin with the author's vst/build.sh and the
# pinned toolchain, packages it with the toolchain's own tools/release.py and tools/sdk_zip.py (as its reusable
# vst-release.yml does), and leaves the zips in a DRAFT release only, visible to the repository's collaborators.
# Not the reusable workflow itself: it also uploads the zips as run artifacts, which anyone signed in to GitHub can download
# from a public repository; a personal fork's builds stay private (study, section 9; spec 00, implementation notes).
# Runs on a push to the Claude branch whose head commit message holds "[test build]", on every push of a release/* branch, and
# by hand (Actions > Test build > Run workflow) once this file is on the default branch: GitHub offers manual runs only for
# workflows there, and main holds upstream's tree.
name: Test build

on:
  workflow_dispatch:
  push:
    branches: ['claude/gifted-carson-j102ab', 'release/**']

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/release/') || contains(github.event.head_commit.message, '[test build]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: port

      - name: Version, tag and toolchain
        id: v
        working-directory: port
        run: |
          version=$(tools/version.sh force)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cadenza-vst-v$version" >> "$GITHUB_OUTPUT"
          grep -v '^#' .github/toolchain >> "$GITHUB_OUTPUT"

      - name: Refuse to touch a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                    --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          echo "existing release for $TAG: ${state:-none}"
          [ "$state" != published ] || { echo "::error::$TAG is already published: bump versions.json"; exit 1; }

      - name: Check out the toolchain
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ steps.v.outputs.repo }}
          ref: ${{ steps.v.outputs.ref }}
          path: mpc-vst-plugins

      - name: Set up QEMU (the plugin is built for armhf under emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Install Pillow (skin tools)
        run: python3 -m pip install --quiet pillow

      - name: Build (vst/build.sh, with the budget check)
        working-directory: port
        run: vst/build.sh

      - name: Package (tools/release.py, tools/sdk_zip.py)
        id: pkg
        working-directory: port
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          B=vst/build
          skins=("$B"/skin/*/)
          [ ${#skins[@]} = 1 ] && [ -d "${skins[0]}" ] || { echo "::error::expected one skin folder in $B/skin"; exit 1; }
          file -b "$B/cadenza.so" | grep -q 'ELF 32-bit LSB.*ARM' || { echo "::error::$B/cadenza.so is not a 32-bit ARM ELF"; exit 1; }
          python3 "$MPC_VST/tools/release.py" --so "$B/cadenza.so" --skin "${skins[0]%/}" --entry "$B/pluginlist-entry.xml" \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --license PolyForm-Shield-1.0.0 -o "$GITHUB_WORKSPACE/dist" \
            --about "Test build of a personal fork of Cadenza ($GITHUB_REPOSITORY), not an official release."
          armv7=$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip)
          python3 "$MPC_VST/tools/sdk_zip.py" "${armv7%-mpc-armv7.zip}-mpc-sdk.zip" "$armv7"
          echo "zips=$(ls "$GITHUB_WORKSPACE"/dist/*.zip | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          ZIPS: ${{ steps.pkg.outputs.zips }}
          TOOLS: ${{ steps.v.outputs.repo }}@${{ steps.v.outputs.ref }}
        run: |
          {
            echo "Test build of a personal fork of Cadenza, not an official release. It installs under Cadenza's own"
            echo "identity, in place of the official plugin; keep the official zip to restore it."
            echo
            echo "- MPC OS 3.10.1 or later: \`$(basename "$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-sdk.zip)")\`, its folder copied into \`VST2 Plugins\`."
            echo "- MPC OS 3.9.1 or earlier: \`$(basename "$(ls "$GITHUB_WORKSPACE"/dist/*-mpc-armv7.zip)")\`, with its install.sh."
            echo
            echo "Built by GitHub Actions from $GITHUB_REPOSITORY@${GITHUB_SHA::7} ($GITHUB_REF_NAME) with $TOOLS."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ZIPS --clobber
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "Cadenza $VERSION (test build)" --notes-file notes.md
          else
            gh release create "$TAG" $ZIPS --draft --target "$GITHUB_SHA" --title "Cadenza $VERSION (test build)" --notes-file notes.md
          fi
          {
            echo "## $TAG"
            echo "Draft release updated: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (drafts are visible to collaborators only)."
            for z in $ZIPS; do echo "- \`$(basename "$z")\` ($(du -h "$z" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"

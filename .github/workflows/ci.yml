# Continuous integration (docs/development/specs/00-infrastructure.md, 3.1): the author's own build and offline tests,
# unchanged; the compatibility harness against the official 0.28.1; the CPG coverage measurement. No run artifacts: builds of
# this personal fork leave the runner only as draft releases (build.yml).
name: CI

on:
  push:
    branches: ['claude/gifted-carson-j102ab', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: port

      - name: Read the pinned toolchain
        id: tc
        run: grep -v '^#' port/.github/toolchain >> "$GITHUB_OUTPUT"

      - name: Check out the toolchain
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ steps.tc.outputs.repo }}
          ref: ${{ steps.tc.outputs.ref }}
          path: mpc-vst-plugins

      - name: Set up QEMU (the plugin is built for armhf under emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Install Pillow (skin tools)
        run: python3 -m pip install --quiet pillow

      - name: Build (vst/build.sh, with the budget check)
        working-directory: port
        run: vst/build.sh

      - name: Offline tests (tests/run_tests.sh)
        working-directory: port
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/port/.github/lsan.supp
        run: tests/run_tests.sh

      - name: Record the build's measurements
        working-directory: port
        run: |
          {
            echo "## Build"
            echo "- Version: $(tools/version.sh force)"
            echo "- Toolchain: ${{ steps.tc.outputs.repo }}@${{ steps.tc.outputs.ref }}"
            size=$(stat -c %s vst/build/cadenza.so)
            kb=$(python3 -c 'import json; print(json.load(open("vst/budget.json"))["binary_kb"])')
            echo "- cadenza.so: $size bytes, md5 $(md5sum vst/build/cadenza.so | cut -d' ' -f1)"
            echo "- Binary budget: $kb KB ($((kb * 1024)) bytes), headroom $((kb * 1024 - size)) bytes"
            echo "- Parameters: $(python3 -c 'import json; print(len(json.load(open("vst/params.json"))["params"]))')"
            echo "- Core parity: $(cut -d' ' -f1 tests/core_parity.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the fork, with the history back to 0.28.1
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compatibility harness (tests/compat/run.sh)
        run: tests/compat/run.sh

  cpg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the fork and the CPG submodule
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Coverage measurement (tools/cpg/coverage.sh --check)
        run: tools/cpg/coverage.sh --check

      - name: The palette table and its report (tools/cpg/generate.sh --check)
        run: tools/cpg/generate.sh --check
